services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: studyroom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 23Netherbound
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studyroom
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 23Netherbound
    depends_on:
      - db

volumes:
  pgdata:
